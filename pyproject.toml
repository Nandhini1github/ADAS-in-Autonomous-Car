[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "town10-adas"
version = "0.2.0"
description = "Reproducible PID/MPC AEB experiments and shared ROS 2 controller core"
requires-python = ">=3.10"

[project.optional-dependencies]
plots = ["matplotlib>=3.6,<4"]
scenario2 = ["numpy>=1.24,<3", "opencv-python-headless>=4.8,<5", "Pillow>=9,<13"]

[tool.setuptools.packages.find]
where = ["src"]
